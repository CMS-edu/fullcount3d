# Render Blueprint — Render 대시보드에서 "New > Blueprint"로 이 저장소를 고르면 자동 설정돼요
services:
  - type: web
    name: fullcount3d
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
